name: Instagram

# Posts today's freshly published articles to Instagram as branded card
# images. Runs on a daily cron, when a person's push changes lib/posts.ts,
# and when a desk starts it after publishing (scripts/hand-off-social.sh).
# Requires IG_USER_ID and IG_ACCESS_TOKEN in repo Settings → Secrets and
# variables → Actions. See docs/INSTAGRAM-SETUP.md.

on:
  # Fires when a person's push or merged PR changes lib/posts.ts. The desks
  # push with their workflow token, which starts no other workflow, so
  # Autopilot, the Morning Brief, and Sales tax start this one themselves
  # after they publish (wait_for_deploy below). The poster waits for the site
  # to redeploy before posting. The posted-state commit touches only
  # data/instagram-posted.json (and carries [skip ci]), so it cannot retrigger
  # this workflow.
  push:
    branches: [main]
    paths:
      - "lib/posts.ts"
  # Daily run. The poster takes only stories dated today in Chicago, so this
  # cannot recover a story published after it runs; the desks' hand-off
  # covers those.
  schedule:
    # Daily at 15:30 UTC (10:30 AM CDT / 9:30 AM CST).
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      wait_for_deploy:
        description: "Wait for the site to rebuild before reading the feed (the desks set this after they publish)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      # Skip cleanly (green, no failure email) until the Instagram secrets
      # exist. See docs/INSTAGRAM-SETUP.md.
      - name: Check configuration
        id: config
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -n "$IG_USER_ID" ] && [ -n "$IG_ACCESS_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Instagram posting is not configured (IG_USER_ID / IG_ACCESS_TOKEN missing). Skipping. See docs/INSTAGRAM-SETUP.md."
          fi

      - name: Setup Node
        if: ${{ steps.config.outputs.configured == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: npm ci

      # A run started by a push, or by a desk that just published (see
      # scripts/hand-off-social.sh), starts before the site has rebuilt, so
      # the RSS feed the poster reads would still be stale and the new
      # article would be invisible to it. Give the deploy a head start. The
      # poster reads the feed once, so a deploy that outlasts this wait loses
      # the story; the daily cron can recover it only if it runs later the
      # same Chicago day.
      - name: Wait for deploy (runs started by a new story)
        if: ${{ (github.event_name == 'push' || inputs.wait_for_deploy) && steps.config.outputs.configured == 'true' }}
        run: sleep 360

      - name: Post to Instagram
        if: ${{ steps.config.outputs.configured == 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/post-instagram.mjs

      # Runs even when the posting step fails partway: each successful publish
      # is written to data/instagram-posted.json immediately, and losing that
      # record would double-post the same article on the next run.
      - name: Commit posted-state changes
        if: ${{ !cancelled() && steps.config.outputs.configured == 'true' }}
        run: |
          git config user.name "Jackson Wire Autopilot"
          git config user.email "autopilot@thejacksonwire.com"
          git add data/instagram-posted.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Instagram: record posted articles [skip ci]"
            # Autopilot/Morning Brief may have pushed to main while this job
            # ran; rebase our one state commit instead of hard-failing. The
            # step must fail loudly if the push never lands: losing this
            # commit means double-posting the same article on the next run.
            pushed=false
            for i in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Push rejected (attempt $i); rebasing onto latest main..."
              git pull --rebase origin main
              sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::Failed to push posted-state commit after 3 attempts"
              exit 1
            fi
          fi
