name: Sports desk

# Researches and writes one Mississippi college sports story a day
# (scripts/sports-desk.mjs): Ole Miss and Mississippi State first, the
# state's other colleges when they have the biggest news.
# Requires DEEPSEEK_API_KEY. Web search uses TAVILY_API_KEY, then
# BRAVE_API_KEY (optional), then DuckDuckGo with no key.
#
# Story ideas also come from the schools' press conferences: each run lists
# the recent sessions Ole Miss and Mississippi State posted to YouTube and can
# read their transcripts (scripts/lib/press-conferences.mjs). YouTube refuses
# caption requests from GitHub's runners, so the owner's Mac saves each new
# transcript to the claude/press-transcripts branch every two hours
# (scripts/press-transcripts-sync.mjs, scripts/press-transcripts-mac.sh), and
# this workflow hands that branch's transcripts to the desk. That branch holds
# only data and turns Vercel deployments off, so its pushes cost no deploys.
#
# Before it researches, an idea scout reads tips (Bluesky posts, the schools'
# insider podcasts, Mississippi search trends) next to what outlets already
# published and pitches original story ideas (scripts/lib/sports-tips.mjs,
# scripts/lib/sports-scout.mjs). The pitches go to the run summary. Tips are
# never sources: every idea is verified like any other story.
#
# Runs daily on the schedule below and publishes. Manual runs default to a dry
# run: the draft and its check results go to the run summary and nothing is
# published. Untick "dry run" to publish.

on:
  schedule:
    # Daily at 14:00 UTC: 8 a.m. Central standard time (9 a.m. daylight).
    # GitHub often starts scheduled runs late.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: draft and check, but publish nothing"
        type: boolean
        default: true

permissions:
  contents: write
  # Lets the hand-off step start the Social and Instagram workflows.
  actions: write

concurrency:
  group: sports-desk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test the desk's checks
        run: node --test scripts/lib/sports-desk-checks.test.mjs scripts/lib/press-conferences.test.mjs scripts/press-transcripts-sync.test.mjs scripts/lib/sports-tips.test.mjs scripts/lib/sports-scout.test.mjs

      # The transcripts the Mac job saved. Extracted outside the checkout, so
      # nothing from that branch can end up in the desk's commit. If the
      # branch is missing, the desk asks YouTube directly (which usually
      # fails from here) and falls back to news reports of the sessions.
      - name: Fetch saved press conference transcripts
        run: |
          dir="$RUNNER_TEMP/press-transcripts"
          mkdir -p "$dir"
          if git fetch --quiet --depth=1 origin claude/press-transcripts; then
            git archive FETCH_HEAD transcripts | tar -x -C "$dir" || echo "No saved transcripts on the branch."
          else
            echo "No claude/press-transcripts branch; the desk will try YouTube directly."
          fi
          echo "Saved transcripts: $(find "$dir" -name '*.json' | wc -l)"
          echo "PRESS_TRANSCRIPTS_DIR=$dir/transcripts" >> "$GITHUB_ENV"

      - name: Note the starting commit
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run the sports desk
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          # A scheduled run has no inputs, so it publishes.
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: node scripts/sports-desk.mjs

      # When this run put a story on main, start Social and Instagram, which
      # a push with this workflow's token cannot do. See
      # scripts/hand-off-social.sh.
      - name: Hand the new story to social posting
        if: ${{ !cancelled() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ steps.start.outputs.sha }}
        run: bash scripts/hand-off-social.sh "$START"
