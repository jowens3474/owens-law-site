name: Meeting Archive

# Pulls new public-meeting videos from the city's own archive
# (jacksonms.swagit.com), transcribes them (Groq Whisper if GROQ_API_KEY is
# set, otherwise faster-whisper on the runner), stores the transcripts in
# data/meetings/, and has DeepSeek index each one. Feeds /meetings and the
# desk's meeting_transcripts tool. Publishes no articles.

on:
  schedule:
    # Daily at 10:00 UTC (5 AM CDT), after the previous evening's meetings
    # have been uploaded and YouTube has generated captions.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Blank to ingest; 'list' prints candidate videos; 'ytprobe' tests YouTube access"
        required: false
        default: ""
      video:
        description: "Videos to ingest directly: Swagit ids (400748) or YouTube ids/URLs, comma-separated"
        required: false
        default: ""
      limit:
        description: "Videos to ingest this run (each can take 20+ minutes to transcribe)"
        required: false
        default: "2"
      backfill:
        description: "List this many older uploads per channel (0 = recent feed only)"
        required: false
        default: "0"
      force:
        description: "Re-ingest the given videos even if archived (1 = force)"
        required: false
        default: "0"
      dry_run:
        description: "Print what would be written without writing (1 = dry run)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: meeting-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Deno (JavaScript runtime yt-dlp needs for YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install --quiet --upgrade yt-dlp faster-whisper
          yt-dlp --version
          ffmpeg -version | head -1

      # faster-whisper downloads its model from Hugging Face on first use;
      # keep it between runs (about 500 MB for small.en).
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'small.en' }}

      # YouTube requires a proof-of-origin token from datacenter addresses
      # (GitHub runners), otherwise every request gets "confirm you're not a
      # bot". bgutil-ytdlp-pot-provider mints the token; yt-dlp loads it as
      # a plugin and calls the script through BGUTIL_SCRIPT (see lib).
      - name: Install proof-of-origin token provider
        run: |
          python3 -m pip install --quiet bgutil-ytdlp-pot-provider
          git clone --quiet --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$RUNNER_TEMP/bgutil"
          cd "$RUNNER_TEMP/bgutil/server"
          npm ci --silent --no-audit --no-fund
          npx tsc
          echo "BGUTIL_SCRIPT=$RUNNER_TEMP/bgutil/server/build/generate_once.js" >> "$GITHUB_ENV"
          yt-dlp -v --print title --skip-download "https://www.youtube.com/watch?v=bfwlmLU0BAc" 2>&1 | grep -i "pot\|Extracting\|plugin" | head -20 || true

      # Optional: a Netscape-format cookie file exported from a browser signed
      # in to YouTube, stored as the YOUTUBE_COOKIES secret. Only needed if
      # YouTube's bot check blocks every player client from the runner.
      - name: Write YouTube cookies if configured
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/youtube-cookies.txt"
            echo "YTDLP_COOKIES=$RUNNER_TEMP/youtube-cookies.txt" >> "$GITHUB_ENV"
            echo "Cookie file written."
          else
            echo "No YOUTUBE_COOKIES secret; using anonymous access."
          fi

      - name: Archive meetings
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}
          MODE: ${{ github.event.inputs.mode }}
          VIDEO: ${{ github.event.inputs.video }}
          LIMIT: ${{ github.event.inputs.limit }}
          BACKFILL: ${{ github.event.inputs.backfill }}
          FORCE: ${{ github.event.inputs.force }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          YTDLP_ARGS: ${{ vars.YTDLP_ARGS }}
        run: node scripts/meeting-archive.mjs

      - name: Commit archive changes
        if: ${{ !cancelled() && github.event.inputs.dry_run != '1' }}
        run: |
          git config user.name "Jackson Wire Autopilot"
          git config user.email "autopilot@thejacksonwire.com"
          git add data/meetings
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Meetings: archive new transcripts"
            pushed=false
            for i in 1 2 3; do
              if git push origin HEAD:${GITHUB_REF_NAME}; then pushed=true; break; fi
              echo "Push rejected (attempt $i); rebasing..."
              git pull --rebase origin "${GITHUB_REF_NAME}"
              sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::Failed to push archive after 3 attempts"
              exit 1
            fi
          fi
