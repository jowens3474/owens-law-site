name: Meeting Archive

# Pulls new public-meeting videos from the governments' YouTube channels,
# stores the captions as searchable transcripts in data/meetings/, and has
# DeepSeek index each one. Feeds /meetings and the desk's
# meeting_transcripts tool. Publishes no articles.

on:
  schedule:
    # Daily at 10:00 UTC (5 AM CDT), after the previous evening's meetings
    # have been uploaded and YouTube has generated captions.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Blank to ingest; 'list' to print candidate videos only"
        required: false
        default: ""
      video:
        description: "YouTube ids or URLs to ingest directly (comma-separated)"
        required: false
        default: ""
      limit:
        description: "Videos to ingest this run"
        required: false
        default: "6"
      backfill:
        description: "List this many older uploads per channel (0 = recent feed only)"
        required: false
        default: "0"
      force:
        description: "Re-ingest the given videos even if archived (1 = force)"
        required: false
        default: "0"
      dry_run:
        description: "Print what would be written without writing (1 = dry run)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: meeting-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install --quiet --upgrade yt-dlp
          yt-dlp --version

      - name: Archive meetings
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MODE: ${{ github.event.inputs.mode }}
          VIDEO: ${{ github.event.inputs.video }}
          LIMIT: ${{ github.event.inputs.limit }}
          BACKFILL: ${{ github.event.inputs.backfill }}
          FORCE: ${{ github.event.inputs.force }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          YTDLP_ARGS: ${{ vars.YTDLP_ARGS }}
        run: node scripts/meeting-archive.mjs

      - name: Commit archive changes
        if: ${{ !cancelled() && github.event.inputs.dry_run != '1' }}
        run: |
          git config user.name "Jackson Wire Autopilot"
          git config user.email "autopilot@thejacksonwire.com"
          git add data/meetings
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Meetings: archive new transcripts"
            pushed=false
            for i in 1 2 3; do
              if git push origin HEAD:${GITHUB_REF_NAME}; then pushed=true; break; fi
              echo "Push rejected (attempt $i); rebasing..."
              git pull --rebase origin "${GITHUB_REF_NAME}"
              sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::Failed to push archive after 3 attempts"
              exit 1
            fi
          fi
