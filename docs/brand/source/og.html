<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><style>
body { width: 600px; height: 315px; background: #fff; color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.rule-top, .rule-bot { position: absolute; left: 40px; right: 40px; border-top: 3px solid #111; }
.rule-top { top: 38px; } .rule-top::after, .rule-bot::after { content: ""; position: absolute; left: 0; right: 0; border-top: 1px solid #111; }
.rule-top::after { top: 3px; } .rule-bot { bottom: 38px; } .rule-bot::after { bottom: 4px; }
.mark { font-family: "Bodoni Moda", serif; font-weight: 900; font-size: 52px; line-height: 1; letter-spacing: -0.025em; }
.tag { margin-top: 18px; font-family: "Libre Franklin", sans-serif; font-weight: 600; font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #555; }
.bar { margin-top: 16px; width: 60px; border-top: 2px solid #a80000; }
.url { margin-top: 13px; font-family: "Libre Franklin", sans-serif; font-weight: 700; font-size: 11.5px; letter-spacing: 0.3em; text-transform: uppercase; }
</style></head><body>
<div class="rule-top"></div>
<div class="mark">The Jack<span class="dollar-s">s</span>on Wire</div>
<div class="tag">Business, economics, and what is coming next in Jackson.</div>
<div class="bar"></div>
<div class="url">thejacksonwire.com</div>
<div class="rule-bot"></div>
</body></html>
